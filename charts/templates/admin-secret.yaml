{{- if .Values.adminSecret.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.adminSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when adminSecret.enabled is true" .Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when adminSecret.enabled is true" .Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ .Values.adminSecret.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when adminSecret.enabled is true" .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when adminSecret.enabled is true" .Values.infisical.environmentSlug | quote }}
      secretPath: {{ .Values.adminSecret.secretPath | quote }}
  targets:
    - name: {{ .Values.adminSecret.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      metadata:
        annotations: {}
        labels: {}
      template:
        engineVersion: v1
        data:
          {{- range $key, $remoteKey := .Values.adminSecret.keys }}
          {{ $key }}: {{ printf "{{ .%s.Value }}" $remoteKey | quote }}
          {{- end }}
{{- end }}
