suite: Admin password InfisicalStaticSecret
templates:
  - templates/admin-secret.yaml
release:
  name: keycloak
  namespace: keycloak
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: syncs the admin password into the Secret the upstream chart reads
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - equal:
          path: metadata.name
          value: keycloak-admin-credentials-secret
      - equal:
          path: spec.infisicalAuthRef
          value:
            name: fake-auth
            namespace: fake-auth-namespace
      - equal:
          path: spec.sources
          value:
            - projectSlug: fake-project
              environmentSlug: fake-env
              secretPath: /keycloak/fake-admin
      - equal:
          path: spec.targets[0].name
          value: keycloak-admin-credentials-secret
      - equal:
          path: spec.targets[0].creationPolicy
          value: Owner
      - equal:
          path: spec.targets[0].template.data
          value:
            KEYCLOAK_ADMIN_PASSWORD: "{{ .KEYCLOAK_ADMIN_PASSWORD.Value }}"

  - it: maps a renamed Infisical key
    values:
      - ../ci/all-on-values.yaml
    set:
      adminSecret.keys.KEYCLOAK_ADMIN_PASSWORD: ADMIN_PASSWORD
    asserts:
      - equal:
          path: spec.targets[0].template.data
          value:
            KEYCLOAK_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD.Value }}"
