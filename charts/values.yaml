# Wrapper chart defaults. Environment values (hosts, Infisical connection) live in cluster-config.
# This file is not templated. YAML anchors only work within one file.

# The wrapper's Infisical operator connection (same shape as the infisical and jenkins charts).
infisical:
  # InfisicalAuth reference used by the admin password InfisicalStaticSecret.
  authRef:
    name: ""
    namespace: ""
  # Infisical project slug holding the admin password.
  projectSlug: ""
  # Infisical environment slug holding the admin password.
  environmentSlug: ""

adminSecret:
  # true -> sync the admin password Secret through an InfisicalStaticSecret.
  enabled: false
  # Name of the Kubernetes Secret created for the admin password. Must match keycloak.auth.existingSecret.
  secretName: keycloak-admin-credentials-secret
  # Infisical secret path to read the admin password from.
  secretPath: /keycloak/admin
  # How often the operator re-syncs the Secret.
  refreshInterval: 60s
  # Map of target Secret key: Infisical key. keycloak.auth.passwordSecretKey must be one of these keys.
  keys:
    KEYCLOAK_ADMIN_PASSWORD: KEYCLOAK_ADMIN_PASSWORD

ingressRoute:
  # true -> render one Traefik IngressRoute per hosts entry, pointing at the Keycloak Service.
  enabled: false
  # Traefik entry points, shared by every host.
  entryPoints:
    - websecure
  # Value of the kubernetes.io/ingress.class annotation.
  ingressClass: traefik-external
  # Traefik middlewares shared by every host: list of name and namespace entries.
  middlewares: []
  # One IngressRoute per entry, named keycloak-ingress-<name>. Each entry has name, host and tlsSecretName.
  hosts: []

# Globals for the upstream chart.
global:
  security:
    # Bitnami refuses images outside its own repositories unless this is true. Ours is the Harbor copy.
    allowInsecureImages: true
  compatibility:
    openshift:
      # Not OpenShift: keep the security context as written.
      adaptSecurityContext: disabled

# Values passed to the upstream Bitnami keycloak dependency (used as-is, never forked).
# Only keys that differ from the upstream 25.2.0 defaults are listed.
keycloak:
  image:
    registry: harbor.prod.raulstechtips.dev
    repository: raulstechtips/keycloak
    tag: 26.3.3-debian-12-r0
  # Pass credentials as env vars instead of mounted files.
  usePasswordFiles: false
  auth:
    adminUser: admin
    # The Secret synced by adminSecret.
    existingSecret: keycloak-admin-credentials-secret
    passwordSecretKey: KEYCLOAK_ADMIN_PASSWORD
  production: true
  # TLS ends at Traefik. Keycloak serves plain HTTP behind it.
  tls:
    autoGenerated:
      enabled: false
  proxyHeaders: xforwarded
  httpEnabled: true
  logging:
    output: json
  extraEnvVars:
    - name: JAVA_OPTS_APPEND
      value: "-Dcom.redhat.fips=false"
  containerSecurityContext:
    readOnlyRootFilesystem: false
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  # At most one Keycloak pod per node.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: keycloak
          topologyKey: kubernetes.io/hostname
  defaultInitContainers:
    prepareWriteDirs:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 196Mi
  # CA for verify-ca on the database connection.
  extraVolumes:
    - name: postgres-ca-cert
      secret:
        secretName: raulstechtips-internal-ca-key-pair
        items:
          - key: ca.crt
            path: postgres-ca.crt
  extraVolumeMounts:
    - name: postgres-ca-cert
      mountPath: /etc/custom-certs
      readOnly: true
  # Bundled PostgreSQL off. The database is the prod CNPG cluster.
  postgresql:
    enabled: false
  # The credentials and CA Secrets are managed outside this chart and must already exist.
  externalDatabase:
    host: pg-prod-rw.prod.svc.cluster.local
    user: pg-keycloak-admin
    database: keycloak
    existingSecret: pg-keycloak-database-credentials-secret
    existingSecretUserKey: username
    existingSecretPasswordKey: password
    extraParams: "&sslmode=verify-ca&sslrootcert=/etc/custom-certs/postgres-ca.crt"
