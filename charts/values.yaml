# The wrapper's Infisical operator connection (same shape as the infisical and jenkins charts).
infisical:
  # InfisicalAuth reference used by the admin password InfisicalStaticSecret.
  authRef:
    name: ""
    namespace: ""
  # Infisical project slug holding the admin password.
  projectSlug: ""
  # Infisical environment slug holding the admin password.
  environmentSlug: ""

adminSecret:
  # true -> sync the admin password Secret through an InfisicalStaticSecret.
  enabled: false
  # Name of the Kubernetes Secret created for the admin password. Must match the KC_BOOTSTRAP_ADMIN_PASSWORD Secret in keycloak.extraEnv.
  secretName: keycloak-admin-credentials-secret
  # Infisical secret path to read the admin password from.
  secretPath: /keycloak/admin
  # How often the operator re-syncs the Secret.
  refreshInterval: 60s
  # Map of target Secret key: Infisical key. The KC_BOOTSTRAP_ADMIN_PASSWORD key in keycloak.extraEnv must be one of these keys.
  keys:
    KEYCLOAK_ADMIN_PASSWORD: KEYCLOAK_ADMIN_PASSWORD

ingressRoute:
  # true -> render one Traefik IngressRoute per hosts entry, pointing at the Keycloak Service.
  enabled: false
  # Traefik entry points, shared by every host.
  entryPoints:
    - websecure
  # Value of the kubernetes.io/ingress.class annotation.
  ingressClass: traefik-external
  # Traefik middlewares shared by every host: list of name and namespace entries.
  middlewares: []
  # One IngressRoute per entry, named keycloak-ingress-<name>. Each entry has name, host and tlsSecretName.
  hosts: []

keycloak:
  image:
    tag: "26.3.3"
  # Production mode. The official image has no default command arguments.
  args:
    - start
  replicas: 3
  podManagementPolicy: Parallel
  # Serve at / (the chart default is /auth). The issuer URLs stay the same.
  http:
    relativePath: /
  proxy:
    mode: xforwarded
  # Keycloak builds jdbc:postgresql://<hostname>:<port>/<database><KC_DB_URL_PROPERTIES>. Port: Keycloak default 5432.
  database:
    vendor: postgres
    hostname: pg-prod-rw.prod.svc.cluster.local
    database: keycloak
    existingSecret: pg-keycloak-database-credentials-secret
  # Our own keys (not upstream). extraEnv reads them to build KC_DB_URL_PROPERTIES,
  # so a deployment with another Postgres CA setup overrides only these.
  customPostgresCA:
    customVerifySslMode: verify-ca
    # Path of the CA file inside the pod (see extraVolumes and extraVolumeMounts).
    customSslRootCert: /etc/custom-certs/postgres-ca.crt
  # The upstream chart renders this string with tpl and its own values (keycloak.*).
  # No KC_HOSTNAME and hostname-strict false: each host (dev, prod, live) gets its own issuer.
  # The admin Secret name and key must match adminSecret.secretName and adminSecret.keys.
  extraEnv: |
    - name: KC_DB_URL_PROPERTIES
      value: {{ printf "?currentSchema=public&sslmode=%s&sslrootcert=%s" .Values.customPostgresCA.customVerifySslMode .Values.customPostgresCA.customSslRootCert | quote }}
    - name: KC_DB_SCHEMA
      value: public
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: pg-keycloak-database-credentials-secret
          key: username
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_LOG_CONSOLE_OUTPUT
      value: json
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-credentials-secret
          key: KEYCLOAK_ADMIN_PASSWORD
  # JGroups port for the jdbc-ping cluster. Declared so the NetworkPolicy allows it between pods.
  extraPorts:
    - name: discovery
      containerPort: 7800
  # Merged with the upstream defaults (runAsUser 1000, runAsNonRoot true, fsGroup 1000).
  securityContext:
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  podDisruptionBudget:
    maxUnavailable: 1
  # Plain HTTP only. TLS ends at Traefik.
  service:
    httpsPort: 0
  networkPolicy:
    enabled: true
    extraFrom:
      - namespaceSelector: {}
      - ipBlock:
          cidr: 0.0.0.0/0
    egress:
      - {}
  # CA for verify-ca on the database connection.
  extraVolumes: |
    - name: postgres-ca-cert
      secret:
        secretName: raulstechtips-internal-ca-key-pair
        items:
          - key: ca.crt
            path: postgres-ca.crt
  extraVolumeMounts: |
    - name: postgres-ca-cert
      mountPath: /etc/custom-certs
      readOnly: true
